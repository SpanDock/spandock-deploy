# Copy to inventory.ini. Hosts need Ubuntu 24.04+ / Debian 13 (glibc 2.38+), systemd and outbound HTTPS.
[spandock_servers]
hub ansible_host=203.0.113.10
# A satellite joins a hub with a single-use code from the hub (Settings → Scaling → Add server).
# Prefer passing it on the command line: -e spandock_join_code=spandock-join:...
# satellite1 ansible_host=203.0.113.11 spandock_join_code=spandock-join:...

[spandock_servers:vars]
ansible_user=ubuntu
